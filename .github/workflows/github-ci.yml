name: Vue Weather Service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --run

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E acceptance tests
        run: npm run test:e2e

  version:
    name: Update Version
    runs-on: ubuntu-latest
    needs: acceptance-tests

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'GitHub CI: update version to ')

    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          set -euo pipefail

          git config user.name "teb-github-ci-actions"
          git config user.email "teb-github-ci-actions@users.noreply.github.com"

      - name: Determine version increment
        id: increment
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          COMMIT_SUBJECT="${COMMIT_MESSAGE%%$'\n'*}"

          if [[ ! "$COMMIT_SUBJECT" =~ ^(bug|fix|doc|feat|updt|checkpt):[[:space:]]+.+$ ]]; then
            echo "::error::prefix missing/mismatch. Expected one of: bug:, fix:, doc:, feat:, updt:, checkpt:."
            echo "::error::Commit subject: ${COMMIT_SUBJECT}"
            exit 1
          fi

          PREFIX="${BASH_REMATCH[1]}"

          case "$PREFIX" in
            bug|fix|doc)
              INCREMENT_TYPE="patch"
              ;;
            feat|updt)
              INCREMENT_TYPE="minor"
              ;;
            checkpt)
              INCREMENT_TYPE="major"
              ;;
          esac

          echo "Commit subject: ${COMMIT_SUBJECT}"
          echo "Prefix: ${PREFIX}"
          echo "Version increment: ${INCREMENT_TYPE}"

          echo "type=${INCREMENT_TYPE}" >> "$GITHUB_OUTPUT"

      - name: Increment VERSION
        id: version
        env:
          INCREMENT_TYPE: ${{ steps.increment.outputs.type }}
        run: |
          set -euo pipefail

          if [[ ! -f VERSION ]]; then
            echo "::error::VERSION file is missing."
            exit 1
          fi

          CURRENT_VERSION=$(tr -d '[:space:]' < VERSION)

          if [[ ! "$CURRENT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::Invalid VERSION value: '${CURRENT_VERSION}'. Expected MAJOR.MINOR or MAJOR.MINOR.PATCH."
            exit 1
          fi

          if [[ "$CURRENT_VERSION" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH=0
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          fi

          case "$INCREMENT_TYPE" in
            patch)
              PATCH=$((PATCH + 1))
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            *)
              echo "::error::Unknown version increment: ${INCREMENT_TYPE}"
              exit 1
              ;;
          esac

          NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          printf '%s\n' "$NEXT_VERSION" > VERSION

          echo "Version: ${CURRENT_VERSION} -> ${NEXT_VERSION}"
          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

          git add VERSION
          git commit -m "GitHub CI: update version to ${NEXT_VERSION}"

      - name: Create version tag
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          set -euo pipefail

          TAG="v${NEXT_VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists on origin."
            exit 1
          fi

          git tag "$TAG"

      - name: Push version commit and tag
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          set -euo pipefail

          TAG="v${NEXT_VERSION}"

          git push --atomic origin \
            HEAD:refs/heads/main \
            "refs/tags/${TAG}"

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [ unit-tests, acceptance-tests, version ]

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.unit-tests.result == 'success' &&
      needs.acceptance-tests.result == 'success' &&
      needs.version.result == 'success'

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout updated main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vue application
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=vue-weather-service --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
